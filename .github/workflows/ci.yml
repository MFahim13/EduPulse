name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    name: PHP lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          tools: none
      - name: Check every PHP file for syntax errors
        run: find . -name '*.php' -not -path './vendor/*' -print0 | xargs -0 -n1 php -l

  test:
    name: PHPUnit (Docker)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Start the app and database
        run: |
          cp .env.example .env
          docker compose up -d --build --wait
      - name: Install test dependencies
        run: docker compose exec -T app composer install --no-interaction --no-progress
      - name: Run the test suite
        run: docker compose exec -T app vendor/bin/phpunit
      - name: Show app logs on failure
        if: failure()
        run: docker compose logs app
